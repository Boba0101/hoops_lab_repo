name: hoops_lab_v1
description: "A basketball athlete tracker app to track athlete performance and suggest the athlete to continue training or stop when needed.."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  # CORRECTED to a valid and safe Dart SDK range
  sdk: '>=3.2.0 <4.0.0'

# ALL version numbers have been removed below to force a clean resolution
dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core:
  firebase_auth:
  cloud_firestore:
  firebase_storage:

  # State Management & Storage
  provider:
  shared_preferences:
  hive:
  hive_flutter:
  path_provider:

  # UI & Utilities
  cupertino_icons:
  intl:
  fl_chart: ^0.68.0 # --- THE KEY FIX: Using the latest stable version ---
  flutter_svg:
  cached_network_image:
  image_picker:
  uuid:
  table_calendar:

  # Date & Time Pickers
  flutter_datetime_picker_plus:
  flutter_time_picker_spinner:

  # Maps & Location
  google_maps_flutter:
  
  geolocator:
  geocoding:
  
  flutter_google_places_hoc081098:

  flutter_google_places_sdk: 0.4.2+1
  
  # Google & Networking
  google_sign_in:
  google_api_headers:
  http:
  package_info_plus: ^4.2.0
  google_generative_ai: ^0.4.0
  collection: ^1.19.1


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints:

flutter:
  uses-material-design: true